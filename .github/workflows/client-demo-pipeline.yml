name: Client Demo - Complete CI/CD Pipeline

on:
  pull_request:
  push:
    branches: [main, master, develop, feature]
  workflow_dispatch:
    inputs:
      demo-mode:
        description: Run without real JFrog and OpenShift services
        required: false
        default: true
        type: boolean
      image-name:
        description: Demo container image name
        required: false
        default: demo-java-application
        type: string

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test Java Application
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.metadata.outputs.artifact_name }}
      image-name: ${{ steps.metadata.outputs.image_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn -B clean package

      - name: Package application artifact
        id: metadata
        env:
          IMAGE_NAME: ${{ inputs.image-name || 'demo-java-application' }}
        run: |
          artifact_name="application-${GITHUB_SHA}.tar.gz"
          tar -czf "${RUNNER_TEMP}/${artifact_name}" --exclude=.git --exclude=target .
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-${{ github.sha }}
          path: ${{ runner.temp }}/application-${{ github.sha }}.tar.gz

  container-security:
    name: Container Build and Vulnerability Report
    needs: build-and-test
    uses: ./.github/workflows/container-build-security.yml
    with:
      context: .
      dockerfile: Dockerfile
      image: demo-java-application

  coverity:
    name: Coverity Scan
    needs: build-and-test
    uses: ./.github/workflows/coverity-scan.yml
    secrets: inherit

  black-duck:
    name: Black Duck Scan
    needs: build-and-test
    uses: ./.github/workflows/blackduck-scan.yml
    secrets: inherit

  secret-scan:
    name: Secret Scan
    needs: build-and-test
    uses: ./.github/workflows/secret-scan.yml
    secrets: inherit

  iac-security:
    name: IaC Security Scan
    needs: build-and-test
    uses: ./.github/workflows/iac-security.yml
    secrets: inherit

  jfrog-publish:
    name: Publish Artifact to JFrog (Demo)
    needs: [build-and-test, container-security, coverity, black-duck, secret-scan, iac-security]
    runs-on: ubuntu-latest
    steps:
      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: application-${{ github.sha }}
          path: jfrog-staging

      - name: Simulate JFrog publish
        env:
          DEMO_MODE: ${{ inputs.demo-mode || true }}
        run: |
          test "$DEMO_MODE" = true
          artifact="$(find jfrog-staging -name '*.tar.gz' -print -quit)"
          test -n "$artifact"
          sha256sum "$artifact" | tee jfrog-staging/artifact.sha256
          {
            echo "## JFrog Artifact Repository (Demo)"
            echo "- Status: simulated publish successful"
            echo "- Repository: demo-release"
            echo "- Artifact: $(basename "$artifact")"
            echo "- SHA-256: $(cut -d' ' -f1 jfrog-staging/artifact.sha256)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload simulated JFrog package
        uses: actions/upload-artifact@v4
        with:
          name: jfrog-demo-release-${{ github.sha }}
          path: jfrog-staging

  openshift-deploy:
    name: Deploy to OpenShift (Demo)
    needs: [jfrog-publish, container-security]
    runs-on: ubuntu-latest
    steps:
      - name: Simulate OpenShift deployment
        env:
          IMAGE_NAME: demo-java-application:${{ github.sha }}
          DEMO_MODE: ${{ inputs.demo-mode || true }}
        run: |
          test "$DEMO_MODE" = true
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## OpenShift Deployment (Demo)
          - Status: simulated deployment successful
          - Namespace: demo-staging
          - Workload: demo-java-application
          - Image: ${IMAGE_NAME}
          - Rollout: complete
          - Readiness: passed
          - Liveness: passed
          - Smoke test: passed
          EOF

  pipeline-summary:
    name: Complete Pipeline Summary
    if: always()
    needs: [build-and-test, container-security, coverity, black-duck, secret-scan, iac-security, jfrog-publish, openshift-deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Publish client workflow summary
        env:
          RESULTS: ${{ join(needs.*.result, ', ') }}
        run: |
          {
            echo "## Client Demo Pipeline"
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Java build and tests | ${{ needs.build-and-test.result }} |"
            echo "| Docker build and vulnerability scan | ${{ needs.container-security.result }} |"
            echo "| Coverity scan | ${{ needs.coverity.result }} |"
            echo "| Black Duck scan | ${{ needs.black-duck.result }} |"
            echo "| Secret scan | ${{ needs.secret-scan.result }} |"
            echo "| IaC security scan | ${{ needs.iac-security.result }} |"
            echo "| JFrog artifact publish | ${{ needs.jfrog-publish.result }} |"
            echo "| OpenShift deployment and validation | ${{ needs.openshift-deploy.result }} |"
            echo ""
            echo "Pipeline results: $RESULTS"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$RESULTS" != *failure*
          test "$RESULTS" != *cancelled*
