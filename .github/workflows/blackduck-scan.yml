name: Application Security - Black Duck

on:
  pull_request:
  push:
    branches: [main, master, develop]
  workflow_dispatch:
  workflow_call:
    secrets:
      BLACKDUCK_URL:
        required: false
      BLACKDUCK_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  black-duck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect dependencies
        run: |
          find . -maxdepth 3 -type f \( -name package.json -o -name pom.xml -o -name requirements.txt -o -name go.mod \) -print
      - name: Check Black Duck configuration
        id: config
        env:
          BLACKDUCK_URL: ${{ secrets.BLACKDUCK_URL }}
          BLACKDUCK_TOKEN: ${{ secrets.BLACKDUCK_TOKEN }}
        run: |
          if [ -n "$BLACKDUCK_URL" ] && [ -n "$BLACKDUCK_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run Black Duck scan
        if: steps.config.outputs.available == 'true'
        run: echo "Black Duck credentials found; vendor scan command is ready to be configured."
      - name: Skip Black Duck scan
        if: steps.config.outputs.available != 'true'
        run: |
          echo "WARNING: Black Duck URL/token not configured; scan skipped for now."
