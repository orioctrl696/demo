name: Release Management

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
  workflow_call:
    inputs:
      generate-release-notes:
        description: Generate release notes automatically
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GENERATE_RELEASE_NOTES: ${{ inputs.generate-release-notes || true }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: ${{ env.GENERATE_RELEASE_NOTES }}
